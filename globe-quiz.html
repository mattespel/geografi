<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globe quiz</title>
<style>
:root{--bg:#0e1a24;--panel:#16293a;--ink:#eef3f6;--dim:#93a8b6;--line:#2a4256;--guess:#d1432b;--truth:#1c8a5a;--gold:#ffd24a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#geo{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none}
#geo canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.top,.bottom{position:fixed;left:0;right:0;padding:14px 18px;pointer-events:none;display:flex;gap:12px;z-index:2}
.top{top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));justify-content:space-between;align-items:flex-start;background:linear-gradient(var(--bg),transparent)}
.bottom{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));flex-direction:column;align-items:center;background:linear-gradient(transparent,var(--bg))}
.city{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.1;margin:0}
.sub{color:var(--dim);font-size:.95rem;margin-top:4px}
.count{color:var(--dim);font-size:.95rem;white-space:nowrap;padding-top:6px;text-align:right}
#msg{min-height:2.6em;text-align:center;font-size:1rem;color:var(--dim);line-height:1.35}
#msg b{color:var(--ink);font-size:1.25rem}
.g{color:var(--guess)}.t{color:var(--truth)}
button{pointer-events:auto;font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 28px;background:var(--gold);color:#1a1400;cursor:pointer;min-width:200px}
button:disabled{background:var(--line);color:var(--dim);cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#end{position:fixed;inset:0;z-index:5;background:rgba(10,20,30,.94);display:none;overflow:auto;padding:24px 18px}
#end.on{display:block}
.card{max-width:560px;margin:0 auto}
.card h2{font-family:Georgia,serif;font-size:2rem;margin:.2em 0 .6em}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:20px}
.stats div{font-size:.9rem;color:var(--dim)}
.stats strong{display:block;font-size:2rem;color:var(--ink);font-family:Georgia,serif}
table{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:#4cc790}.no{color:#e8806b}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="geo"></div>

<div class="top">
  <div><h1 class="city" id="city">Loading…</h1><div class="sub" id="hint"></div></div>
  <div class="count" id="count"></div>
</div>
<div class="bottom">
  <div id="msg">Drag to rotate, pinch or scroll to zoom, tap to place your pin.</div>
  <button id="btn" disabled>Check answer</button>
</div>

<div id="end"><div class="card">
  <h2>Results</h2>
  <div class="stats">
    <div><strong id="rScore"></strong>within 100 km</div>
    <div><strong id="rAcc"></strong>accuracy</div>
    <div><strong id="rAvg"></strong>average distance</div>
  </div>
  <table><thead><tr><th>City</th><th class="n">Distance</th><th class="n">Accuracy</th></tr></thead><tbody id="rRows"></tbody></table>
  <button id="again">Play again</button>
</div></div>

<script>
/* ==========================================================================
   GLOBE QUIZ  (standalone version of the Anki globe card)
   Needs, in the same folder as this file:
     _three.min.js, earth.avif
   Structure:
     1. SETTINGS   2. QUESTIONS   3. HELPERS   4. GLOBE ENGINE   5. GAME
   ========================================================================== */
(function(){
'use strict';

/* ---------- 1. SETTINGS ---------- */
var R = Math.PI / 180;
var MINZ = 1.15, MAXZ = 6, DEFZ = 3.7, REVEALZ = 1.4, MAXTILT = 1.55, MAXDPR = 2, MARKER = 0.8;
var NIGHT = 0.5, SUN_LON = null, SUNDIST = 12, SUNSIZE = 2.5, SUNFADE = 0.5;
var FIT = 0.7, TANH = Math.tan(17.5 * R);
var TEXTURE_SRC = 'earth.avif', THREE_SRC = 'three.min.js';
var COL_GUESS = 0xd1432b, COL_TRUTH = 0x1c8a5a, COL_ARC = 0xffd24a;

// Scoring
var CORRECT_KM = 100;        // within this distance counts as correct
var ZERO_KM   = 4000;        // distance at which a round's accuracy reaches 0%
// Per-round accuracy = 100% at 0 km, falling linearly to 0% at ZERO_KM.

/* ---------- 2. QUESTIONS (edit this list) ---------- */
var CITIES = [
  { name: 'Tokyo',          hint: 'Japan',        lat:  35.68, lon:  139.69 },
  { name: 'Cairo',          hint: 'Egypt',        lat:  30.04, lon:   31.24 },
  { name: 'Rio de Janeiro', hint: 'Brazil',       lat: -22.91, lon:  -43.17 },
  { name: 'Sydney',         hint: 'Australia',    lat: -33.87, lon:  151.21 },
  { name: 'Reykjavik',      hint: 'Iceland',      lat:  64.15, lon:  -21.94 },
  { name: 'Nairobi',        hint: 'Kenya',        lat:  -1.29, lon:   36.82 },
  { name: 'Mexico City',    hint: 'Mexico',       lat:  19.43, lon:  -99.13 },
  { name: 'Mumbai',         hint: 'India',        lat:  19.08, lon:   72.88 },
  { name: 'Moscow',         hint: 'Russia',       lat:  55.76, lon:   37.62 },
  { name: 'Vancouver',      hint: 'Canada',       lat:  49.28, lon: -123.12 }
];

/* ---------- 3. HELPERS ---------- */
function $(id){ return document.getElementById(id); }
function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
function clampZ(z){ return clamp(z, MINZ, MAXZ); }
function clampTilt(x){ return clamp(x, -MAXTILT, MAXTILT); }
function wrap(x){ while(x > Math.PI) x -= 2*Math.PI; while(x < -Math.PI) x += 2*Math.PI; return x; }
function vec(lat, lon, r){
  return new THREE.Vector3(Math.cos(lat*R)*Math.cos(lon*R), Math.sin(lat*R), -Math.cos(lat*R)*Math.sin(lon*R)).multiplyScalar(r || 1);
}
function latlon(v){ v = v.clone().normalize(); return { lat: Math.asin(v.y)/R, lon: Math.atan2(-v.z, v.x)/R }; }
function hav(a, b, c, d){
  var dLat=(c-a)*R, dLon=(d-b)*R,
      h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*R)*Math.cos(c*R)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*6371*Math.asin(Math.sqrt(h));
}
function angleBetween(p, q){ return Math.acos(clamp(p.dot(q), -1, 1)); }
function slerp(p, q, w, t){
  return p.clone().multiplyScalar(Math.sin((1-t)*w)).add(q.clone().multiplyScalar(Math.sin(t*w))).divideScalar(Math.sin(w));
}
function rotationFor(p){ return { y: -Math.PI/2 - p.lon*R, x: clampTilt(p.lat*R) }; }
function fitZ(th){ th = Math.max(th, 0.04); return clampZ(Math.cos(th) + Math.sin(th)/(FIT*TANH)); }
function subsolar(){
  var now = new Date(), N = (now - Date.UTC(now.getUTCFullYear(),0,1))/864e5 + 1,
      lat = -23.44*Math.cos(2*Math.PI/365*(N+10)), B = 2*Math.PI*(N-81)/364,
      eot = 9.87*Math.sin(2*B) - 7.53*Math.cos(B) - 1.5*Math.sin(B),
      h = now.getUTCHours() + now.getUTCMinutes()/60 + now.getUTCSeconds()/3600,
      lon = SUN_LON !== null ? SUN_LON : 15*(12 - h - eot/60);
  return { lat: lat, lon: ((lon+540)%360)-180 };
}
function glowTex(){
  var c = document.createElement('canvas'); c.width = c.height = 128;
  var x = c.getContext('2d'), g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,240,1)'); g.addColorStop(.12,'rgba(255,235,150,.95)');
  g.addColorStop(.35,'rgba(255,200,80,.35)'); g.addColorStop(1,'rgba(255,180,60,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
function fullUrl(p){ try{ return new URL(p, location.href).href; }catch(e){ return p; } }
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1; i>0; i--){ var j = Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function accuracy(km){ return clamp(100*(1 - km/ZERO_KM), 0, 100); }
function fmt(n){ return Math.round(n).toLocaleString('en'); }

/* ---------- 4. GLOBE ENGINE ---------- */
function createGlobe(host, onPlace){
  var G = { keep:0, raf:0, target:null, camZ:DEFZ, pts:{}, down:null, pinch:null, moved:false,
            guess:null, ans:null, locked:false };
  var _sunPos = new THREE.Vector3(), _sunView = new THREE.Vector3();

  var ren = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  ren.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAXDPR));
  var cv = ren.domElement; cv.style.opacity = 0; host.appendChild(cv);

  var sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 1, 0.05, 50);
  cam.position.z = DEFZ;

  var sunLocal = vec(subsolar().lat, subsolar().lon);
  var sunU = { value: sunLocal.clone() }, nightU = { value: NIGHT };
  var mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  mat.onBeforeCompile = function(sh){
    sh.uniforms.sunDir = sunU; sh.uniforms.night = nightU;
    sh.vertexShader = sh.vertexShader
      .replace('void main() {', 'varying vec3 vObjN;\nvoid main() {')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObjN=normalize(position);');
    sh.fragmentShader = sh.fragmentShader
      .replace('void main() {', 'varying vec3 vObjN;\nuniform vec3 sunDir;\nuniform float night;\nvoid main() {')
      .replace('#include <dithering_fragment>', '#include <dithering_fragment>\n' +
        'gl_FragColor.rgb*=mix(night,1.0,smoothstep(-0.1,0.15,dot(normalize(vObjN),sunDir)));');
  };
  var globe = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), mat);
  sc.add(globe);
  sc.add(new THREE.Mesh(new THREE.SphereGeometry(1.05,48,32),
    new THREE.MeshBasicMaterial({ color:0x6fa8c8, transparent:true, opacity:.14, side:THREE.BackSide })));

  var mk = new THREE.Group(); globe.add(mk);
  var sun = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex(), blending:THREE.AdditiveBlending, transparent:true, depthWrite:false }));
  sun.scale.set(SUNSIZE, SUNSIZE, 1); sc.add(sun);

  var unitSphere = new THREE.SphereGeometry(1,16,12), ray = new THREE.Raycaster();

  G.resetView = function(){
    globe.rotation.set((Math.random()*2-1)*0.8, Math.random()*Math.PI*2, 0);
    G.camZ = DEFZ; cam.position.z = DEFZ; G.target = null;
  };
  G.resetView();

  function frame(){
    G.raf = 0;
    var busy = G.keep > 0; if(busy) G.keep--;
    if(G.target){
      var t = G.target;
      globe.rotation.y += wrap(t.y - globe.rotation.y)*.08;
      globe.rotation.x += (t.x - globe.rotation.x)*.08;
      if(Math.abs(wrap(t.y-globe.rotation.y)) + Math.abs(t.x-globe.rotation.x) < .003) G.target = null;
      busy = true;
    }
    var dz = G.camZ - cam.position.z;
    if(Math.abs(dz) > .0005){ cam.position.z += dz*.15; busy = true; }

    var s = clamp((cam.position.z-1)/3.2, .08, 1)*MARKER, c = mk.children;
    for(var n=0; n<c.length; n++) if(c[n].isMesh) c[n].scale.setScalar(c[n].userData.size*s);

    _sunPos.copy(sunLocal).applyQuaternion(globe.quaternion).multiplyScalar(SUNDIST);
    sun.position.copy(_sunPos); cam.updateMatrixWorld();
    _sunView.copy(_sunPos).applyMatrix4(cam.matrixWorldInverse);
    var fade = 0;
    if(_sunView.z < 0){
      _sunPos.project(cam);
      fade = clamp((1 - Math.max(Math.abs(_sunPos.x), Math.abs(_sunPos.y)))/SUNFADE, 0, 1);
      fade = fade*fade*(3-2*fade);
    }
    sun.material.opacity = fade; sun.visible = fade > 0;

    ren.render(sc, cam);
    if(busy) G.raf = requestAnimationFrame(frame);
  }
  function kick(){ G.keep = 2; if(!G.raf) G.raf = requestAnimationFrame(frame); }

  function loadTex(){
    new THREE.TextureLoader().load(TEXTURE_SRC, function(t){
      t.generateMipmaps = false; t.minFilter = THREE.LinearFilter;
      t.anisotropy = ren.capabilities.getMaxAnisotropy();
      mat.map = t; mat.needsUpdate = true;
      cv.style.transition = 'opacity .25s'; cv.style.opacity = 1; kick();
    }, undefined, function(){
      mat.color.set(0x9fc3d6); cv.style.opacity = 1; kick();
      $('msg').textContent = 'Could not load ' + fullUrl(TEXTURE_SRC) + ' (file missing, wrong name, or the browser cannot open it). Paste that address into a new tab to test.';
    });
  }
  loadTex();

  function dot(lat, lon, col, size, opacity){
    var m = new THREE.Mesh(unitSphere, new THREE.MeshBasicMaterial({ color:col, transparent:opacity<1, opacity:opacity }));
    m.userData.size = size; m.scale.setScalar(size); m.position.copy(vec(lat, lon, 1)); mk.add(m);
  }
  function arc(g, a){
    var p = vec(g.lat,g.lon), q = vec(a.lat,a.lon), w = angleBetween(p,q);
    if(w <= 1e-3) return;
    var lift = Math.min(.05, .02*w), pts = [];
    for(var i=0; i<=48; i++){ var t=i/48; pts.push(slerp(p,q,w,t).multiplyScalar(1.003 + lift*Math.sin(Math.PI*t))); }
    mk.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color:COL_ARC })));
  }
  function marks(){
    while(mk.children.length){
      var m = mk.children[mk.children.length-1]; mk.remove(m);
      if(!m.isMesh) m.geometry.dispose(); m.material.dispose();
    }
    if(G.ans){
      dot(G.ans.lat, G.ans.lon, COL_TRUTH, .045, .35);
      dot(G.ans.lat, G.ans.lon, COL_TRUTH, .022, 1);
      if(G.guess) arc(G.guess, G.ans);
    }
    if(G.guess) dot(G.guess.lat, G.guess.lon, COL_GUESS, .024, 1);
    kick();
  }

  // Show the answer and frame both pins
  G.reveal = function(ans){
    G.ans = ans; G.locked = true; marks();
    var guess = G.guess, p = vec(guess.lat,guess.lon), q = vec(ans.lat,ans.lon),
        ang = angleBetween(p,q), z = fitZ(ang/2), centre = p.clone().add(q);
    if(ang/2 > Math.acos(1/z)*.92){
      z = MAXZ;
      if(ang > 3.1) centre = q.clone();
      else { var s = Math.min(Math.acos(1/z)*.8, ang/2); centre = slerp(p,q,ang,(ang-s)/ang); }
    }
    G.target = rotationFor(centre.length() > .05 ? latlon(centre) : ans);
    G.camZ = Math.max(z, REVEALZ); kick();
  };

  // Clear pins for the next question
  G.next = function(){ G.ans = null; G.guess = null; G.locked = false; G.resetView(); marks(); };

  function pinchDist(){ var k = Object.keys(G.pts), a = G.pts[k[0]], b = G.pts[k[1]]; return Math.hypot(a.x-b.x, a.y-b.y); }
  function place(e){
    var r = cv.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height*2-1)), cam);
    var hit = ray.intersectObject(globe)[0]; if(!hit) return;
    G.guess = latlon(globe.worldToLocal(hit.point.clone()));
    marks(); onPlace(G.guess);
  }
  cv.addEventListener('pointerdown', function(e){
    cv.setPointerCapture(e.pointerId); G.pts[e.pointerId] = { x:e.clientX, y:e.clientY }; G.target = null;
    if(Object.keys(G.pts).length >= 2){ G.pinch = { d:pinchDist(), z:G.camZ }; G.down = null; return; }
    G.down = { x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY }; G.moved = false; cv.style.cursor = 'grabbing';
  });
  cv.addEventListener('pointermove', function(e){
    if(G.pts[e.pointerId]) G.pts[e.pointerId] = { x:e.clientX, y:e.clientY };
    if(G.pinch && Object.keys(G.pts).length >= 2){ G.camZ = clampZ(1 + (G.pinch.z-1)*G.pinch.d/pinchDist()); kick(); return; }
    var d = G.down; if(!d) return;
    if(!G.moved && Math.hypot(e.clientX-d.x, e.clientY-d.y) < 6) return;
    G.moved = true;
    var k = .0055*(G.camZ-1)/3.2;
    globe.rotation.y += (e.clientX-d.lx)*k;
    globe.rotation.x = clampTilt(globe.rotation.x + (e.clientY-d.ly)*k);
    d.lx = e.clientX; d.ly = e.clientY; kick();
  });
  cv.addEventListener('pointerup', function(e){
    delete G.pts[e.pointerId];
    if(!G.pinch && G.down && !G.moved && !G.locked) place(e);
    G.down = null; if(!Object.keys(G.pts).length) G.pinch = null; cv.style.cursor = 'grab';
  });
  cv.addEventListener('pointercancel', function(e){
    delete G.pts[e.pointerId]; G.down = null; if(!Object.keys(G.pts).length) G.pinch = null;
  });
  cv.addEventListener('wheel', function(e){
    e.preventDefault(); G.camZ = clampZ(1 + (G.camZ-1)*(1 + e.deltaY*.001)); kick();
  }, { passive:false });

  function size(){
    var w = host.clientWidth, h = host.clientHeight;
    if(w && h){ ren.setSize(w, h, false); cam.aspect = w/h; cam.updateProjectionMatrix(); kick(); }
  }
  window.addEventListener('resize', size); size();
  return G;
}

/* ---------- 5. GAME ---------- */
var G, order, idx, results;

function show(i){
  var c = order[i];
  $('city').textContent = c.name; $('hint').textContent = c.hint;
  $('count').textContent = (i+1) + ' / ' + order.length;
  $('msg').textContent = 'Tap the globe to place your pin.';
  $('btn').textContent = 'Check answer'; $('btn').disabled = true;
}

function startGame(){
  order = shuffle(CITIES); idx = 0; results = [];
  $('end').classList.remove('on');
  G.next(); show(0);
}

function check(){
  var c = order[idx], g = G.guess, d = hav(g.lat, g.lon, c.lat, c.lon), acc = accuracy(d), ok = d < CORRECT_KM;
  results.push({ name:c.name, km:d, acc:acc, ok:ok });
  G.reveal(c);
  $('msg').innerHTML = '<b>' + fmt(d) + ' km off</b> · ' + (ok ? 'Correct' : 'Not within ' + CORRECT_KM + ' km') +
    '<br><span class="g">●</span> your guess &nbsp; <span class="t">●</span> correct location';
  $('btn').textContent = idx === order.length-1 ? 'See results' : 'Next city';
}

function finish(){
  var right = results.filter(function(r){ return r.ok; }).length,
      acc = results.reduce(function(s,r){ return s + r.acc; }, 0)/results.length,
      avg = results.reduce(function(s,r){ return s + r.km; }, 0)/results.length;
  $('rScore').textContent = right + ' / ' + results.length;
  $('rAcc').textContent = Math.round(acc) + '%';
  $('rAvg').textContent = fmt(avg) + ' km';
  $('rRows').innerHTML = results.map(function(r){
    return '<tr><td class="' + (r.ok ? 'ok' : 'no') + '">' + r.name + '</td><td class="n">' + fmt(r.km) +
           ' km</td><td class="n">' + Math.round(r.acc) + '%</td></tr>';
  }).join('');
  $('end').classList.add('on');
}

$('btn').addEventListener('click', function(){
  if(!G.locked){ if(G.guess) check(); }
  else if(idx < order.length-1){ idx++; G.next(); show(idx); }
  else finish();
});
$('again').addEventListener('click', startGame);

function fail(title, detail){ $('city').textContent = title; $('msg').textContent = detail; }

function boot(){
  if(!window.THREE) return fail('Three.js not found', THREE_SRC + ' loaded but did not define THREE. Use the classic build (e.g. r128) that defines a global THREE.');
  try{
    G = createGlobe($('geo'), function(){
      $('btn').disabled = false;
      $('msg').textContent = 'Tap again to move the pin, or check your answer.';
    });
    startGame();
  }catch(e){
    fail('Could not start', (e && e.message) ? e.message : String(e));
  }
}

(function loadThree(){
  if(window.THREE) return boot();
  var s = document.createElement('script');
  s.src = THREE_SRC; s.onload = boot;
  s.onerror = function(){ fail('Missing file', 'Could not load ' + THREE_SRC + ' from this folder.'); };
  document.head.appendChild(s);
})();
})();
</script>
</body>
</html>
